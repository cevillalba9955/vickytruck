# Relay nginx: reenvía llamadas locales de Oracle hacia el backend cloud real.
#
# Por qué existe: Oracle (esquema VIC) no tiene salida a internet habilitada
# (política de ACL de red restrictiva del lado de Oracle — se descartó que
# fuera solo falta de privilegio: se probaron http/connect/resolve sobre el
# host y puerto correctos, sin éxito). Este mismo server SÍ tiene salida a
# internet real (Postfix ya relay-ea mail hacia smtp.gmail.com sin problema).
# Con esto, Oracle le pega a nginx por loopback (sin ACL nueva más que la de
# localhost, mismo patrón que ya usa para el mail por localhost:25) y nginx
# hace el salto real a internet como proceso normal del SO.
#
# Instalar en /etc/nginx/conf.d/vickytruck-relay.conf

# 2026-08-10: agregado tras un colgado real de nginx (nada en el error log
# más allá de conexiones que nunca cerraban hacia el upstream). Hipótesis:
# `proxy_pass` con un hostname LITERAL (como estaba antes) hace que nginx
# resuelva vickytruck.fly.dev UNA SOLA VEZ, al arrancar/reload, y cachee esa
# IP para toda la vida del worker — sin `resolver`, nunca vuelve a resolver.
# Fly.io sirve por IPs anycast que pueden dejar de responder sin cerrar el
# socket limpiamente; sin timeouts explícitos, esas conexiones quedan
# colgadas indefinidamente (nginx sin esta directiva usa defaults de 60s,
# pero un socket que ni siquiera falla a nivel TCP puede tardar mucho más),
# acumulando workers hasta que el relay entero deja de responder — no solo
# para Oracle. Resolver + timeouts cortos no elimina la causa raíz (eso
# depende de la red/Fly.io), pero evita que un problema puntual cuelgue todo
# el relay: falla rápido y libera el worker para el siguiente request.
resolver 1.1.1.1 8.8.8.8 valid=30s;

server {
    listen 127.0.0.1:8090;
    server_name localhost;

    # Todo bajo /api/integracion/ se reenvía tal cual (path, método,
    # headers — incluido x-api-key) hacia el backend real. proxy_pass sin
    # path propio (solo scheme://host) hace que nginx pase el URI original
    # completo al upstream sin reescribirlo.
    location /api/integracion/ {
        # $upstream como variable (no un literal en proxy_pass) es lo que
        # obliga a nginx a usar la directiva `resolver` de arriba en vez de
        # resolver una sola vez al arrancar — con un string literal directo
        # en proxy_pass, `resolver` se ignora silenciosamente.
        set $upstream vickytruck.fly.dev;
        proxy_pass https://$upstream;

        # Timeouts cortos A PROPÓSITO: preferible que Oracle vea un error
        # rápido (ORA-29273, ya manejado por armar_error_encadenado del lado
        # PL/SQL) a que la conexión quede colgada minutos y tape workers.
        proxy_connect_timeout 10s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # SNI + Host: Fly.io rutea por Host/SNI para saber a qué app cloud
        # entregar la request — sin esto, proxy_pass a un backend HTTPS con
        # múltiples apps detrás puede fallar el handshake TLS o pegarle a
        # la app equivocada.
        proxy_set_header Host vickytruck.fly.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name vickytruck.fly.dev;

        proxy_set_header Content-Type $content_type;
    }
}
