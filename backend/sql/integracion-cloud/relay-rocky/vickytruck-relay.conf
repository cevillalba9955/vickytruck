# Relay nginx: reenvía llamadas locales de Oracle hacia el backend cloud real.
#
# Por qué existe: Oracle (esquema VIC) no tiene salida a internet habilitada
# (política de ACL de red restrictiva del lado de Oracle — se descartó que
# fuera solo falta de privilegio: se probaron http/connect/resolve sobre el
# host y puerto correctos, sin éxito). Este mismo server SÍ tiene salida a
# internet real (Postfix ya relay-ea mail hacia smtp.gmail.com sin problema).
# Con esto, Oracle le pega a nginx por loopback (sin ACL nueva más que la de
# localhost, mismo patrón que ya usa para el mail por localhost:25) y nginx
# hace el salto real a internet como proceso normal del SO.
#
# Instalar en /etc/nginx/conf.d/vickytruck-relay.conf

server {
    listen 127.0.0.1:8090;
    server_name localhost;

    # Todo bajo /api/integracion/ se reenvía tal cual (path, método,
    # headers — incluido x-api-key) hacia el backend real. proxy_pass sin
    # path propio (solo scheme://host) hace que nginx pase el URI original
    # completo al upstream sin reescribirlo.
    location /api/integracion/ {
        proxy_pass https://vickytruck.fly.dev;

        # SNI + Host: Fly.io rutea por Host/SNI para saber a qué app cloud
        # entregar la request — sin esto, proxy_pass a un backend HTTPS con
        # múltiples apps detrás puede fallar el handshake TLS o pegarle a
        # la app equivocada.
        proxy_set_header Host vickytruck.fly.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name vickytruck.fly.dev;

        proxy_set_header Content-Type $content_type;
    }
}
