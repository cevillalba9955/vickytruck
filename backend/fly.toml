# fly.toml app configuration file generated for vickytruck on 2026-08-05T15:24:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vickytruck'
primary_region = 'gru'

[build]

[env]
  PORT = '3001'

[http_service]
  # Debe coincidir con el puerto real donde escucha server.js (PORT de
  # arriba, default 3001 si no está seteado). 'fly launch' lo autogeneró en
  # 8080 por default y eso dejaba el proxy de Fly reenviando tráfico a un
  # puerto sin nada escuchando (conecta pero nunca responde).
  internal_port = 3001
  force_https = true
  # 'off': este backend necesita quedar siempre conectado al broker MQTT y
  # disponible para los pushes de Oracle/APEX, no puede escalar a cero.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
